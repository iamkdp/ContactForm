<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@observablehq/inspector@5/dist/inspector.css">

</head>

<body>
    <div class="container">
        <div class="top-div">
            <h2>Student Registration Form</h2>
            <hr>
        </div>

        <form action="display.php" method="POST" class="left-conatainer">
            <input type="hidden" name="access_key" value="9cd906f4-6dfa-4c78-b0e3-1bc5648503dc">
           
                <label for="name">Name:</label>
                <input class="input" id="name" type="text" name="name" placeholder="Enter your Name" pattern="[a-zA-Z\s]+" required />
                
                <label for="id">ID:</label>
                <input class="input" id="id" type="text" name="id" placeholder="Enter your ID"  required />
                
                <label for="year">Year:</label>
                <select class="input" name="year" id="year" required>
                  <option value="">Select Year</option>
                  <option value="1">1st Year</option>
                  <option value="2" selected>2nd Year</option>
                  <option value="3">3rd Year</option>
                  <option value="4">4th Year</option>
                </select>
              
                <label for="br">Branch:</label>
                <div class="radiobtn" id="br">
                <label><input type="radio" name="branch" value="CSE" required /> CSE</label>
                <label><input type="radio" name="branch" value="ECE" required /> ECE</label>
                <label><input type="radio" name="branch" value="MECH" required /> MECH</label>
                <label><input type="radio" name="branch" value="CIVIL" required /> CIVIL</label>
                <label><input type="radio" name="branch" value="EEE" required /> EEE</label>
            </div>
                <label for="email">Email:</label>
                <input class="input" type="email" id="email" name="email" placeholder="Enter your Email" required />
              
                <label for="phn">Phone No:</label>
                <input class="input" type="tel" id="phn" name="PhoneNo" placeholder="Enter your phone number" pattern="[0-9]{10}" required />
              
                <label for="message">Feedback:</label>
                <textarea class="message" id="message" name="message" placeholder="Enter your message" id="msg" rows="5" cols="10" required></textarea>
              
                        <button type="submit" value="Submit">Submit
                <img src="arrow_icon.png">
            </button>
        </form>
        <div class="right-container">
            <div id="observablehq-chart-260e76f7"></div>
        </div>
</body>
<script type="module">
    import {Runtime, Inspector} from "https://cdn.jsdelivr.net/npm/@observablehq/runtime@5/dist/runtime.js"; import define from "https://api.observablehq.com/@d3/disjoint-force-directed-graph.js?v=4";
     new Runtime().module(define, name => { if (name === "chart")
    return new Inspector(document.querySelector("#observablehq-chart-260e76f7")); return ["key"].includes(name); });
</script>

</html>
